name: Markdown Link Checker

on:
  schedule:
    - cron: '0 8 * * 1' # weekly on Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Links
        uses: gaurav-nelson/github-action-markdown-link-check@d53a906aa6b22b8979d33bc86170567e619495ec # v1.0.16
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'
